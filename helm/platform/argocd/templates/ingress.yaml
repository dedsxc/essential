apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.global.issuer }}
spec:
  ingressClassName: {{ .Values.global.ingressClass }}
  tls:
    - hosts:
        - argocd.{{ .Values.global.domain }}
      secretName: argocd-tls
  rules:
    - host: argocd.{{ .Values.global.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  name: http
