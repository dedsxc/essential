# Values of the upstream chart go under "traefik:". global.* comes from ArgoCD (domain, issuer...).
traefik:
  ingressClass:
    enabled: true
    isDefaultClass: true
    name: traefik
  ports:
    web:
      # Let HTTP01 challenges through despite the https redirect
      allowACMEByPass: true
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
  service:
    spec:
      type: LoadBalancer
# global.* comes from /cluster.yaml (passed to every chart by the ApplicationSets). Defaults:
global:
  domain: example.com
  issuer: selfsigned-ca
  ingressClass: traefik
  storageClass: ""
  tls:
    issuer: selfsigned
    email: ""
    staging: false
    dns01:
      provider: cloudflare
      secretName: dns01-api-token
      secretKey: api-token
  secrets:
    provider: none
    infisical: {}
