{{- if eq .Values.global.secrets.provider "infisical" }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: infisical
spec:
  provider:
    infisical:
      hostAPI: {{ .Values.global.secrets.infisical.hostAPI }}
      auth:
        universalAuthCredentials:
          clientId:
            key: clientId
            namespace: external-secrets
            name: {{ .Values.global.secrets.infisical.credentialsSecret }}
          clientSecret:
            key: clientSecret
            namespace: external-secrets
            name: {{ .Values.global.secrets.infisical.credentialsSecret }}
      secretsScope:
        projectSlug: {{ .Values.global.secrets.infisical.projectSlug }}
        environmentSlug: {{ .Values.global.secrets.infisical.environmentSlug }}
        secretsPath: /
{{- end }}
