apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infisical
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.global.issuer }}
spec:
  ingressClassName: {{ .Values.global.ingressClass }}
  tls:
    - hosts:
        - infisical.{{ .Values.global.domain }}
      secretName: infisical-tls
  rules:
    - host: infisical.{{ .Values.global.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: infisical-infisical-standalone-infisical
                port:
                  number: 8080
