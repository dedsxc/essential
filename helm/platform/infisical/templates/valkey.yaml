# Valkey (BSD, Redis protocol) for Infisical queues/cache. Password from the install.sh secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infisical-valkey
  labels:
    app: infisical-valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infisical-valkey
  template:
    metadata:
      labels:
        app: infisical-valkey
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: valkey/valkey:8.1-alpine
          args:
            - sh
            - -c
            - exec valkey-server --requirepass "$VALKEY_PASSWORD" --save '' --appendonly no
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: infisical-secrets
                  key: VALKEY_PASSWORD
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - valkey-cli -a "$VALKEY_PASSWORD" --no-auth-warning ping | grep -q PONG
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: infisical-valkey
spec:
  selector:
    app: infisical-valkey
  ports:
    - port: 6379
      targetPort: redis
      name: redis
