# Self-hosted Infisical. Its Postgres (CNPG) and Valkey live in templates/, same namespace.
# Root secrets (ENCRYPTION_KEY, AUTH_SECRET, REDIS_URL) are generated by install.sh, never in Git.
infisical-standalone:
  infisical:
    replicaCount: 1
    rolloutOnEveryRender: false
    kubeSecretRef: infisical-secrets
    extraEnv:
      - name: DB_CONNECTION_URI
        valueFrom: {secretKeyRef: {name: infisical-pg-app, key: uri}}
    resources:
      requests: {cpu: 100m, memory: 384Mi}
      limits: {memory: 2Gi}   # 1Gi: OOMKilled during DB migrations on first start
  ingress: {enabled: false, nginx: {enabled: false}}   # our own templates/ingress.yaml
  postgresql: {enabled: false}
  redis: {enabled: false}
database: {size: 5Gi}
# global.* comes from /cluster.yaml (passed to every chart by the ApplicationSets). Defaults:
global:
  domain: example.com
  issuer: selfsigned-ca
  ingressClass: traefik
  storageClass: ""
  tls: {issuer: selfsigned, email: "", staging: false, dns01: {provider: cloudflare, secretName: dns01-api-token, secretKey: api-token}}
  secrets: {provider: none, infisical: {}}
