# Cilium: eBPF CNI, replaces kube-proxy, L2 load balancer IPs (no MetalLB).
cilium:
  kubeProxyReplacement: true
  # Service LB in the pod datapath too: required when nodes are containers (k3d, kind), harmless elsewhere
  socketLB:
    hostNamespaceOnly: true
  operator:
    replicas: 1
  bpf:
    masquerade: true
  l2announcements:
    enabled: true
  externalIPs:
    enabled: true
  k8sClientRateLimit:
    qps: 20
    burst: 40
  hubble:
    enabled: true
    relay:
      enabled: false
    ui:
      enabled: false
# Homelab L2 load balancer IPs
ciliumLB:
  enabled: false
  start: ""
  stop: ""
# global.* comes from /cluster.yaml (passed to every chart by the ApplicationSets). Defaults:
global:
  domain: example.com
  issuer: selfsigned-ca
  ingressClass: traefik
  storageClass: ""
  tls:
    issuer: selfsigned
    email: ""
    staging: false
    dns01:
      provider: cloudflare
      secretName: dns01-api-token
      secretKey: api-token
  secrets:
    provider: none
    infisical: {}
