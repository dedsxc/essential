{{- /* Your apps: one ArgoCD Application per folder in helm/apps/ (name and namespace = folder name).
     Add helm/apps/my-site/{Chart.yaml,values.yaml}, push, done. Delete the folder to remove the app. */}}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "5"}
spec:
  goTemplate: true
  goTemplateOptions: [missingkey=error]
  generators:
    - git:
        repoURL: {{ .Values.gitops.repoURL }}
        revision: {{ .Values.gitops.targetRevision }}
        directories: [{path: helm/apps/*}]
  template:
    metadata:
      name: '{{`{{ .path.basename }}`}}'
      namespace: argocd
      finalizers: [resources-finalizer.argocd.argoproj.io]
    spec:
      project: default
      destination: {server: https://kubernetes.default.svc, namespace: '{{`{{ .path.basename }}`}}'}
      source:
        repoURL: {{ .Values.gitops.repoURL }}
        targetRevision: {{ .Values.gitops.targetRevision }}
        path: '{{`{{ .path.path }}`}}'
        helm:
          valuesObject:
            global:
              {{- include "kstack.global" . | nindent 14 }}
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        syncOptions: [CreateNamespace=true]
