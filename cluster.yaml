# cluster.yaml: defaults read by every chart (helm/platform/* and helm/apps/*).
# install.sh overrides global.* and the per-brick keys below from your stack.yaml (domain, TLS...):
# change those in stack.yaml and re-run install.sh. Anything else can be set here: edit + push.
global:
  # Apps get <name>.example.com
  domain: example.com
  # ClusterIssuer for Ingresses: selfsigned-ca | letsencrypt
  issuer: selfsigned-ca
  ingressClass: traefik
  # Empty = cluster default
  storageClass: openebs-hostpath
  tls:
    # selfsigned | letsencrypt-http01 | letsencrypt-dns01
    issuer: selfsigned
    email: admin@example.com
    staging: false
    dns01:
      provider: cloudflare
      secretName: dns01-api-token
      secretKey: api-token
  secrets:
    # infisical: ClusterSecretStore for External Secrets
    provider: none
    infisical:
      hostAPI: https://app.infisical.com
      projectSlug: my-project
      environmentSlug: prod
      credentialsSecret: infisical-universal-auth

# Per-brick overrides (key = upstream chart name). Examples:
traefik:
  service:
    spec:
      # NodePort if your cluster has no load balancer
      type: LoadBalancer
