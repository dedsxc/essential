# stack.yaml: single source of truth for your install (copy to stack.yaml and edit).
pack: essential         # free edition (Private AI / All-In-One are paid: https://shop.kien.cc)
domain: example.com   # subdomains: argocd., infisical.
                      # No domain? Leave empty: <ip>.sslip.io (IP = ingress.ciliumLB.start or ingress.nodeIP), self-signed certs
gitops:
  # Git repo ArgoCD watches (your fork of this repo). Private repo: install.sh creates the credential.
  repoURL: https://github.com/myorg/my-platform.git
  targetRevision: main

tls:
  issuer: selfsigned   # selfsigned | letsencrypt-http01 | letsencrypt-dns01
  email: admin@example.com
  staging: false
  dns01: {provider: cloudflare, secretName: dns01-api-token, secretKey: api-token}
ingress:
  className: traefik
  serviceType: LoadBalancer   # NodePort + nodeIP (server IP) as a last resort
  nodeIP: ""
  # Homelab with Cilium: load balancer IPs announced over L2 on your LAN (no MetalLB needed).
  # Requires Cilium with l2announcements.enabled=true. Pick a range outside your router's DHCP.
  ciliumLB: {enabled: false, start: "", stop: ""}
dns:
  provider: none       # none | cloudflare | aws | google ... (external-dns)
secrets:
  provider: none       # none (generated by install.sh) | infisical (External Secrets ClusterSecretStore)
  infisical: {hostAPI: https://app.infisical.com, projectSlug: kube-ia, environmentSlug: prod, credentialsSecret: infisical-universal-auth}
storage:
  # openebs-hostpath: local volumes on the node disk (homelab, k3s, bare metal)
  # none: keep the cluster StorageClass (EKS gp3, GKE pd, ...)
  provider: openebs-hostpath
  makeDefault: false   # true if the cluster has no default StorageClass
storageClass: openebs-hostpath   # empty = cluster default StorageClass
# Cilium (optional): eBPF CNI, replaces kube-proxy, L2 load balancer (with ingress.ciliumLB).
# Cluster created WITHOUT a CNI nor kube-proxy, e.g. k3s: --flannel-backend=none --disable-network-policy --disable-kube-proxy
# install.sh installs it before ArgoCD (Helm), then ArgoCD manages it.
cilium: {k8sServiceHost: "", k8sServicePort: 6443, podCIDR: 10.42.0.0/16}
optional: {cilium: false}
components: {}
