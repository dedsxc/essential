# Exemple: deployer une app avec le chart app-template (oci://ghcr.io/dedsxc/app-template, source: github.com/dedsxc/labs/helm/fork).
# Copier dans votre repo GitOps; ArgoCD la synchronise. Doc complete du schema: README du chart.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: argocd
spec:
  project: default
  destination: {server: https://kubernetes.default.svc, namespace: my-app}
  source:
    repoURL: ghcr.io/dedsxc
    chart: app-template
    targetRevision: 2.0.0
    helm:
      valuesObject:
        controller:
          containers:
            main:
              image: {repository: nginx, tag: "1.27"}
        service:
          main:
            ports: {http: {port: 80}}
        ingress:
          main:
            enabled: true
            className: traefik
            annotations: {cert-manager.io/cluster-issuer: selfsigned-ca}   # ou letsencrypt
            hosts:
              - host: my-app.example.com
                paths: [{path: /, service: {identifier: main, port: http}}]
            tls: [{secretName: my-app-tls, hosts: [my-app.example.com]}]
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
