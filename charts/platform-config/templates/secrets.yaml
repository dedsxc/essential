{{- /* Secrets applicatifs: synchronises depuis Infisical (ESO) si secrets.provider=infisical,
       sinon crees par install.sh (cles aleatoires) avant la synchro ArgoCD. */ -}}
{{- if eq .Values.secrets.provider "infisical" }}
{{- range $s := .Values.appSecrets }}
{{- if has $s.component $.Values.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $s.name }}
  namespace: {{ $s.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: infisical}
  target: {name: {{ $s.name }}, creationPolicy: Owner}
  data:
    {{- range $k, $remote := $s.keys }}
    - secretKey: {{ $k }}
      remoteRef: {key: {{ $remote }}}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
