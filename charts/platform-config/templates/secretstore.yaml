{{- if eq .Values.secrets.provider "infisical" }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical
spec:
  provider:
    infisical:
      hostAPI: {{ .Values.secrets.infisical.hostAPI }}
      auth:
        universalAuthCredentials:
          clientId: {key: clientId, namespace: external-secrets, name: {{ .Values.secrets.infisical.credentialsSecret }}}
          clientSecret: {key: clientSecret, namespace: external-secrets, name: {{ .Values.secrets.infisical.credentialsSecret }}}
      secretsScope:
        projectSlug: {{ .Values.secrets.infisical.projectSlug }}
        environmentSlug: {{ .Values.secrets.infisical.environmentSlug }}
        secretsPath: /
{{- end }}
