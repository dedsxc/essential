{{- /* Bases CloudNativePG pour les composants optionnels (pas de Bitnami) */ -}}
{{- range $c := list "authentik" "coder" "litellm" "infisical" }}
{{- if has $c $.Values.enabled }}
---
apiVersion: v1
kind: Namespace
metadata: {name: {{ $c }}}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $c }}-pg
  namespace: {{ $c }}
spec:
  instances: 1
  bootstrap: {initdb: {database: {{ $c }}, owner: {{ $c }}}}
  storage:
    size: 5Gi
    {{- with $.Values.storageClass }}
    storageClass: {{ . }}
    {{- end }}
{{- end }}
{{- end }}
