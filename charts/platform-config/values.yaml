# Recoit les values du chart platform (cf. charts/platform/values.yaml)
domain: example.com
enabled: []
tls: {issuer: selfsigned, email: admin@example.com, staging: false, dns01: {provider: cloudflare, secretName: dns01-api-token, secretKey: api-token}}
ingress: {className: traefik}
secrets: {provider: none, infisical: {hostAPI: https://app.infisical.com, projectSlug: kube-ia, environmentSlug: prod, credentialsSecret: infisical-universal-auth}}
storageClass: ""
optional: {}
# Secrets attendus par composant. keys: <cle k8s>: <cle Infisical>
appSecrets:
  - {component: monitoring, name: grafana-admin, namespace: monitoring, keys: {admin-user: GRAFANA_ADMIN_USER, admin-password: GRAFANA_ADMIN_PASSWORD}}
  - {component: onyx, name: onyx-postgresql, namespace: onyx, keys: {username: ONYX_PG_USER, password: ONYX_PG_PASSWORD}}
  - {component: onyx, name: onyx-redis, namespace: onyx, keys: {redis_password: ONYX_REDIS_PASSWORD}}
  - {component: onyx, name: onyx-objectstorage, namespace: onyx, keys: {s3_aws_access_key_id: ONYX_S3_ACCESS_KEY, s3_aws_secret_access_key: ONYX_S3_SECRET_KEY, rootUser: ONYX_S3_ACCESS_KEY, rootPassword: ONYX_S3_SECRET_KEY}}
  - {component: onyx, name: onyx-opensearch, namespace: onyx, keys: {opensearch_admin_username: ONYX_OPENSEARCH_USER, opensearch_admin_password: ONYX_OPENSEARCH_PASSWORD}}
  - {component: onyx, name: onyx-userauth, namespace: onyx, keys: {user_auth_secret: ONYX_USER_AUTH_SECRET}}
  - {component: litellm, name: litellm-masterkey, namespace: litellm, keys: {masterkey: LITELLM_MASTER_KEY}}
  - {component: litellm, name: litellm-providers, namespace: litellm, keys: {PROXY_MASTER_KEY: LITELLM_MASTER_KEY, ANTHROPIC_API_KEY: ANTHROPIC_API_KEY, GEMINI_API_KEY: GEMINI_API_KEY, AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY}}
  - {component: renovate, name: renovate-env, namespace: renovate, keys: {RENOVATE_TOKEN: RENOVATE_TOKEN}}
  - {component: authentik, name: authentik-env, namespace: authentik, keys: {AUTHENTIK_SECRET_KEY: AUTHENTIK_SECRET_KEY}}
