global: {domain: argocd.{{ .Values.domain }}}
configs:
  params: {server.insecure: true}
  cm:
    resource.exclusions: |
      - apiGroups: [cilium.io]
        kinds: [CiliumIdentity]
server:
  ingress:
    enabled: true
    ingressClassName: {{ .Values.ingress.className }}
    annotations:
      {{- include "platform.ingressAnn" . | nindent 6 }}
    tls: true
dex: {enabled: false}
notifications: {enabled: false}
