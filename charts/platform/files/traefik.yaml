ingressClass: {enabled: true, isDefaultClass: true, name: traefik}
{{- $np := eq (.Values.ingress.serviceType | default "LoadBalancer") "NodePort" }}
providers:
  kubernetesIngress:
    # LoadBalancer: publish the LB address. NodePort (homelab): no LB address exists, so publish the
    # node IP instead, otherwise every Ingress (and ArgoCD) stays "Progressing" forever.
    publishedService: {enabled: {{ not $np }}}
{{- if $np }}
    ingressEndpoint: {ip: {{ .Values.ingress.nodeIP | default "127.0.0.1" | quote }}}
{{- end }}
ports:
  web:
    # laisse passer les challenges HTTP01 malgre la redirection https
    allowACMEByPass: true
    http:
      redirections:
        entryPoint: {to: websecure, scheme: https, permanent: true}
# LoadBalancer (cloud, k3s ServiceLB, MetalLB) or NodePort for a homelab without load balancer.
service:
  spec:
    type: {{ .Values.ingress.serviceType | default "LoadBalancer" }}
