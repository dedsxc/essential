# Self-hosted Infisical. Postgres = CNPG (infisical-pg), Redis = Valkey (both in platform-config).
# Root secrets (ENCRYPTION_KEY, AUTH_SECRET, REDIS_URL) are generated by install.sh, never in Git.
infisical:
  replicaCount: 1
  rolloutOnEveryRender: false   # GitOps: no restart on every ArgoCD sync
  kubeSecretRef: infisical-secrets
  extraEnv:
    - name: DB_CONNECTION_URI
      valueFrom: {secretKeyRef: {name: infisical-pg-app, key: uri}}
    - name: SITE_URL
      value: https://infisical.{{ .Values.domain }}
  resources:
    requests: {cpu: 100m, memory: 384Mi}
    limits: {memory: 1000Mi}
ingress:
  enabled: true
  hostName: infisical.{{ .Values.domain }}
  ingressClassName: {{ .Values.ingress.className }}
  nginx: {enabled: false}
  annotations:
    {{- include "platform.ingressAnn" . | nindent 4 }}
  tls:
    - hosts: [infisical.{{ .Values.domain }}]
      secretName: infisical-tls
postgresql: {enabled: false}
redis: {enabled: false}
